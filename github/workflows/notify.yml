name: PushPlus Notify

on:
  schedule:
    # 每天北京时间 08:00 执行
    # GitHub 用 UTC 时区，北京时间减 8 小时
    - cron: '0 4 * * *'

  # 允许手动运行（方便测试）
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send notification
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          LF_TOKEN: ${{ secrets.LF_TOKEN }} # 必须加上这个，不然 python 里读不到天街的 token
        # 注意检查你的 python 文件到底叫什么，是 scripts/pushplus_notify.py 吗？
        # 如果代码改成了我给你的天街签到版本，建议把文件名也改一下，比如 scripts/checkin.py
        run: python scripts/pushplus_notify.py 

